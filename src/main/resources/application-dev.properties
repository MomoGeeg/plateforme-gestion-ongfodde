# Profil "dev" — démarrage local sans définir APP_JWT_SECRET.
# Lancer avec : .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=dev"
# Ne pas utiliser ce secret en production : définir APP_JWT_SECRET ou un secret fort côté déploiement.

app.jwt.secret=DevOnly-DoNotUseInProduction-JwtSecretKey-AtLeast32CharsLong

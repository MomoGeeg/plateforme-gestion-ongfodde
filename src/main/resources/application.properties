spring.application.name=ongfodde

# Fichier optionnel pour secrets locaux (non versionné) — copier depuis application-local.properties.example
spring.config.import=optional:classpath:application-local.properties

# --- Base de données ---
# Ne pas mettre url/user/mot de passe ici : utiliser application-local.properties (dev)
# ou les variables d'environnement SPRING_DATASOURCE_URL / USERNAME / PASSWORD (Spring les lie automatiquement).
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=60000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=VARCHAR

# Flyway (activer quand les scripts seront versionnés)
spring.flyway.enabled=false

# JWT — définir dans application-local.properties (app.jwt.secret) ou variable APP_JWT_SECRET
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}

# Sécurité applicative
# false par défaut : POST /api/auth/init renvoie 403. Mettre true uniquement pour créer le premier admin (puis redémarrer avec false).
app.security.init-endpoint-enabled=${APP_INIT_ENDPOINT_ENABLED:false}
# Origines CORS séparées par des virgules (ex. http://localhost:5173,https://app.example.com)
app.security.cors-allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Stockage des fichiers GED (Supabase Storage, bucket PRIVÉ, accès uniquement via le backend)
app.storage.supabase-url=${SUPABASE_URL:}
app.storage.service-key=${SUPABASE_SERVICE_KEY:}
app.storage.bucket=${SUPABASE_STORAGE_BUCKET:ged}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# Derrière le proxy Render : utiliser X-Forwarded-For pour l'IP réelle (journal des téléchargements)
server.forward-headers-strategy=framework

logging.level.root=INFO
logging.level.ong.fodde=DEBUG
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

spring.devtools.restart.enabled=false

spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Tâche optionnelle : une exécution des échéances contrats ~30 s après le démarrage (défaut : désactivé)
app.scheduler.contrat-check-on-startup=false

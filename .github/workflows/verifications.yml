# Vérifications automatiques du backend, à chaque PR et à chaque fusion sur main :
# compilation, tests JUnit et construction du jar (comme le fait le Dockerfile de Render).
name: Vérifications

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verifications-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Compilation et tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # OngfoddeApplicationTests démarre toute l'application : il lui faut la vraie base
      # et les secrets, absents ici. Les autres tests n'utilisent ni base ni réseau.
      - name: Compiler, tester et construire
        run: >
          ./mvnw -B --no-transfer-progress verify
          -Dtest='!OngfoddeApplicationTests'
          -Dsurefire.failIfNoSpecifiedTests=false
